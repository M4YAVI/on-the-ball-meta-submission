name: Deploy VR Games Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vr-games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-games/package-lock.json
      # One install in vr-games serves every app (the same layout one-server.mjs uses locally).
      # onnxruntime-node's install script downloads a CUDA build that GitHub's runners can't fetch (404). The games don't use it.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # Builds the lobby and the five games (Glove Up, Bulb Rush, ON THE BALL, Football, Tennis) and
      # assembles them into vr-games/hub. PUBLIC_BASE puts the games under /<repo>/ on Pages.
      - name: Build lobby and games
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}
        run: node one-server.mjs --build-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vr-games/hub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
